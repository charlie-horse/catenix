apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  # Emitted by some charts (templates copied from `kubectl create -o yaml`);
  # the API server sets it.
  creationTimestamp: null
data:
  greeting: {{ .Values.greeting | quote }}
  kubeVersion: {{ .Capabilities.KubeVersion.Version | quote }}
  {{- if .Capabilities.APIVersions.Has "example.com/v2" }}
  widgetsV2: "true"
  {{- end }}
---
# An empty document.
---
{{- if .Values.extraConfigMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo.fullname" . }}-extra
data: {}
{{- end }}
