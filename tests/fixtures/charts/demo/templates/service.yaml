{{- /* No namespace: Helm (and kubectl -n) fill it in for namespaced kinds. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo.fullname" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "demo.labels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.port }}
